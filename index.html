<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <title>像素割草</title>
  <!-- 发布时递增下面脚本的 ?v= 以刷新 CDN 缓存：js 未设 Cache-Control，边缘会缓存旧文件 -->
  <style>
    html,body{margin:0;height:100%;background:#05070d;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none}
    #game{width:min(94vw,calc((100vh - 16px)*.75));aspect-ratio:480/640;background:#05070d;touch-action:none;image-rendering:pixelated;border-radius:12px;box-shadow:0 0 0 2px #232c47}
  </style>
</head>
<body>
  <canvas id="game" role="img" aria-label="像素割草游戏画布"></canvas>
  <script src="src/config.js?v=32"></script><script src="src/rules.js?v=32"></script><script src="src/combat.js?v=32"></script><script src="src/platform.js?v=32"></script><script src="src/audio.js?v=32"></script>
  <script src="src/gameplay.js?v=32"></script><script src="src/renderer.js?v=32"></script><script src="src/input.js?v=32"></script><script src="game.js?v=32"></script>
</body>
</html>
