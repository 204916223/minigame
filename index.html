<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070d" />
  <title>像素割草</title>
  <!-- 发布时递增下面脚本的 ?v= 以刷新 CDN 缓存：js 未设 Cache-Control，边缘会缓存旧文件 -->
  <style>
    :root{--viewport-height:100vh;--edge-gap:12px}
    @supports(height:100dvh){:root{--viewport-height:100dvh}}
    html,body{margin:0;width:100%;height:100%;background:#05070d;overflow:hidden;-webkit-user-select:none;user-select:none}
    body{height:var(--viewport-height);box-sizing:border-box;display:flex;align-items:center;justify-content:center;
      padding:calc(env(safe-area-inset-top,0px) + var(--edge-gap)) calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + var(--edge-gap)) calc(env(safe-area-inset-left,0px) + 8px)}
    #game{display:block;flex:none;width:min(100%,calc((var(--viewport-height) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 2 * var(--edge-gap)) * .5625));aspect-ratio:9/16;background:#05070d;touch-action:none;image-rendering:pixelated;border-radius:12px;box-shadow:0 0 0 2px #232c47}
  </style>
</head>
<body>
  <canvas id="game" role="img" aria-label="像素割草游戏画布"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="src/config.js?v=40"></script><script src="src/rules.js?v=40"></script><script src="src/combat.js?v=40"></script><script src="src/platform.js?v=40"></script><script src="src/audio.js?v=40"></script>
  <script src="src/cloud.js?v=40"></script><script src="src/gameplay.js?v=40"></script><script src="src/renderer.js?v=40"></script><script src="src/input.js?v=40"></script><script src="game.js?v=40"></script>
</body>
</html>
